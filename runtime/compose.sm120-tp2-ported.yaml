# GLM-5.3-Flash TR3 4bpw — v84 runtime + upstream-core-port r1 (fork build).
# Image: this repo's Dockerfile (digest-pinned v84 base + overlay COPYs +
# in-image compile self-check). Build with ./build.sh — no bind mounts needed.
# This compose is for overlay-style users who prefer the files live-mountable
# from the repo tree: the volume list below is the production compose's
# mount list (compose.sm120-tp2-ablit.yaml), remapped from the production
# apc-overlay tree to ./upstream-core-port/ (identical content — the image
# already carries the same files baked in).
# _flashkda_C.abi3.so is NOT mounted: not shipped in this fork (dormant
# binary; see README-PATCHES.md). Env/command identical to production
# (MTP3, B12X_MLA_SPARSE, nvfp4_ds_mla, prefix caching ON, --max-model-len
# 262144, v84-default cudagraph sizes).

services:
  glm53-flash:
    image: legend/glm53-flash-exl3-k4:r1-upstream-core-port
    container_name: glm53-flash-exl3-k4-ported
    init: true
    ipc: host
    shm_size: 32gb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GLM53_PORT:-8012}:${GLM53_PORT:-8012}"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_DEBUG_KDA_INPUTS: "0"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_USE_B12X_DCP_A2A: "1"
      OMP_NUM_THREADS: "2"
      NCCL_P2P_LEVEL: "4"
    volumes:
      - ${GLM53_MODEL_PATH:?set GLM53_MODEL_PATH to the EXL3 checkpoint}:/model:ro
      - ${GLM53_CACHE_PATH:-./glm53-vllm-cache}:/cache
